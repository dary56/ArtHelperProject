{% extends 'base.html' %}
{% block title %}Добавить шаблон{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h3 class="mb-4">Добавить шаблон для «{{ journal.title }}»</h3>
        <div class="card shadow">
            <div class="card-body">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Файл шаблона (.docx)</label>
                        <input type="file" name="template_file" accept=".docx" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-success">Загрузить</button>
                    <a href="{% url 'journal_detail' journal.pk %}" class="btn btn-link">Отмена</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
